name: build

# Builds Memory Machine on all three platforms and uploads the plugins as artifacts.
# Push a tag like v0.2.0 to also attach them to a GitHub release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-22.04
            name: Linux

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev ninja-build xvfb

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-juce-8.0.4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCOPY_PLUGIN_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Render test (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build-test -DCMAKE_BUILD_TYPE=Release -DCOPY_PLUGIN_AFTER_BUILD=OFF -DMM_BUILD_TESTS=ON -G Ninja
          cmake --build build-test --target MemoryMachineRender --parallel 4
          xvfb-run -a "$(find build-test -name MemoryMachineRender -type f -perm -u+x | head -1)" render-out

      # The artefacts folder holds one subfolder per format.
      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          cp -R build/MemoryMachine_artefacts/Release/* dist/ 2>/dev/null || \
          cp -R build/MemoryMachine_artefacts/* dist/
          rm -rf dist/Standalone 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: MemoryMachine-${{ matrix.name }}
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip per platform
        run: |
          cd artifacts
          for d in */; do zip -r "../${d%/}.zip" "$d"; done

      - uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
